  <style>
    /* ================================================================
       DESIGN TOKENS
    ================================================================ */
    :root {
      --navy:       #071a2e;
      --navy-mid:   #0d2a47;
      --coral:      #0cbfaa;
      --coral-dark: #09998c;
      --gold:       #c9a96e;
      --white:      #ffffff;
      --off-white:  #f7f6f4;
      --border:     #e8e6e2;
      --text:       #1a1f2e;
      --text-mid:   #4a5060;
      --text-light: #7a8090;
      --green-wa:   #25d366;

      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'Inter', system-ui, sans-serif;

      --r-sm:  6px;
      --r-md:  12px;
      --r-lg:  18px;
      --r-xl:  28px;

      --sh-sm: 0 2px 12px rgba(7,26,46,.07);
      --sh-lg: 0 16px 56px rgba(7,26,46,.16);

      --ease: cubic-bezier(.4,0,.2,1);
      --dur:  .28s;
    }

    /* Reduce layout shift when web fonts swap in */
    @font-face {
      font-family: 'Inter-fallback';
      src: local('Arial');
      ascent-override: 90%;
      descent-override: 22%;
      line-gap-override: 0%;
      size-adjust: 107%;
    }
    body { font-family: var(--font-body); color: var(--text); background: var(--white); -webkit-font-smoothing: antialiased; }

    /* ================================================================
       RESET
    ================================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    img { display: block; max-width: 100%; }
    a { text-decoration: none; color: inherit; }
    ul, ol { list-style: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* ================================================================
       SHARED BUTTONS
    ================================================================ */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: .82rem; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; border-radius: 40px;
      transition: transform var(--dur) var(--ease),
                  box-shadow var(--dur) var(--ease),
                  background var(--dur) var(--ease);
    }
    .btn-coral {
      background: var(--coral); color: var(--white);
      padding: 14px 32px;
    }
    .btn-coral:hover {
      background: var(--coral-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(12,191,170,.4);
    }
    .btn-coral-lg { padding: 18px 44px; font-size: .88rem; }
    .btn-ghost {
      background: transparent; color: var(--white);
      padding: 14px 32px;
      border: 1.5px solid rgba(255,255,255,.35);
    }
    .btn-ghost:hover { border-color: var(--white); background: rgba(255,255,255,.08); }
    .btn-navy {
      background: var(--navy); color: var(--white);
      padding: 12px 28px;
    }
    .btn-navy:hover { background: var(--navy-mid); transform: translateY(-1px); }

    /* ================================================================
       SECTION SCAFFOLD
    ================================================================ */
    .sec { padding: 88px 24px; contain: layout; }
    .sec-inner { max-width: 1220px; margin: 0 auto; }
    .sec-alt { background: var(--off-white); }
    .sec-dark { background: var(--navy); }

    /* Scroll-triggered fade-in */
    .fade-up {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity .65s var(--ease), transform .65s var(--ease);
    }
    .fade-up.visible { opacity: 1; transform: none; }
    .fade-up.delay-1 { transition-delay: .1s; }
    .fade-up.delay-2 { transition-delay: .2s; }
    .fade-up.delay-3 { transition-delay: .3s; }

    .sec-label {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: .62rem; font-weight: 700; letter-spacing: .25em;
      text-transform: uppercase; color: var(--coral);
      margin-bottom: 14px;
    }
    .sec-label::after { content: ''; width: 32px; height: 1px; background: var(--coral); }
    .sec-dark .sec-label { color: var(--gold); }
    .sec-dark .sec-label::after { background: var(--gold); }

    .sec-h {
      font-family: var(--font-display);
      font-size: clamp(2rem, 3.6vw, 3rem);
      font-weight: 300; line-height: 1.08;
      color: var(--navy); margin-bottom: 14px;
    }
    .sec-h em { font-style: italic; color: var(--coral); }
    .sec-dark .sec-h { color: var(--white); }
    .sec-dark .sec-h em { color: var(--gold); }

    .sec-sub {
      font-size: .95rem; color: var(--text-mid); line-height: 1.75;
      max-width: 560px; margin-bottom: 52px;
    }
    .sec-dark .sec-sub { color: rgba(255,255,255,.5); }

    /* ================================================================
       HEADER
    ================================================================ */
    #hdr {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(7,26,46,.97);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,.05);
      transition: box-shadow var(--dur) var(--ease);
    }
    #hdr.shadow { box-shadow: var(--sh-lg); }

    .hdr-inner {
      max-width: 1220px; margin: 0 auto; padding: 0 24px;
      height: 70px; display: flex; align-items: center; gap: 28px;
    }
    .hdr-logo { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .hdr-logo img {
      height: 50px; width: auto;
      filter: invert(1) hue-rotate(180deg);
      mix-blend-mode: screen;
      border-radius: 4px;
    }
    .hdr-brand {
      display: flex; flex-direction: column; line-height: 1.1;
      border-left: 1px solid rgba(255,255,255,.12);
      padding-left: 14px;
    }
    .hdr-brand-name {
      font-family: var(--font-display);
      font-size: 1.45rem; font-weight: 300;
      color: var(--white); letter-spacing: .01em;
    }
    .hdr-brand-name em { font-style: italic; color: var(--coral); }
    .hdr-brand-sub {
      font-size: .56rem; font-weight: 700;
      letter-spacing: .22em; text-transform: uppercase;
      color: var(--gold); margin-top: 1px;
    }
    @media (max-width: 480px) {
      .hdr-brand { padding-left: 10px; }
      .hdr-brand-name { font-size: 1.05rem; }
      .hdr-brand-sub { font-size: .5rem; letter-spacing: .18em; }
    }

    .hdr-nav { display: flex; align-items: center; gap: 2px; margin-left: auto; }
    .hdr-nav a {
      font-size: .76rem; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; color: rgba(255,255,255,.65);
      padding: 8px 14px; border-radius: var(--r-sm);
      transition: color var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    .hdr-nav a:hover { color: var(--white); background: rgba(255,255,255,.07); }
    .hdr-nav .btn-cta {
      margin-left: 10px;
      background: var(--coral); color: var(--white) !important;
